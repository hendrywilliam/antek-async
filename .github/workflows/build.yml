name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 only ships webkit2gtk-4.1, so Wails needs this tag here.
          - name: linux/amd64
            os: ubuntu-24.04
            artifact: antek-async-linux-amd64
            binary: build/bin/antek-async
            build_args: -platform linux/amd64 -tags webkit2_41
            test_args: -tags webkit2_41
          - name: windows/amd64
            os: windows-latest
            artifact: antek-async-windows-amd64
            binary: build/bin/antek-async.exe
            build_args: -platform windows/amd64
            test_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install GTK and WebKitGTK headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: wails build -clean -trimpath ${{ matrix.build_args }}

      # Runs after the build: main.go embeds all:frontend/dist, so the frontend
      # must be on disk before the main package can be compiled or tested.
      - name: Test
        shell: bash
        run: go test ${{ matrix.test_args }} ./...

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        shell: bash
        run: |
          chmod +x dist/antek-async-linux-amd64/antek-async
          tar -czf "antek-async-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C dist/antek-async-linux-amd64 antek-async
          zip -j "antek-async-${GITHUB_REF_NAME}-windows-amd64.zip" dist/antek-async-windows-amd64/antek-async.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes ./*.tar.gz ./*.zip \
            || gh release upload "${GITHUB_REF_NAME}" --clobber ./*.tar.gz ./*.zip
